name: C++ Foundation CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install reproducible original guest toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNINT2_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Verify original AArch64 assembly against embedded machine words
        run: python3 tests/verify_assembler_fixtures.py --clang clang-18 --objcopy llvm-objcopy-18
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Independently compile and execute original AArch64 C and IPC guests
        run: >
          python3 tests/verify_compiled_guests.py --build-dir build
          --clang clang-18 --lld ld.lld-18 --objdump llvm-objdump-18
          --check-rpc-fixtures
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNINT2_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNINT2_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
