name: C++ Foundation CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNINT2_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Independently cross-compile original AArch64 C IPC guest
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          ld.lld --version
          clang --target=aarch64-none-elf -O0 -ffreestanding -fno-builtin \
            -fno-stack-protector -fno-unwind-tables -nostdlib -fuse-ld=lld \
            -Wl,-Ttext=0x10000 -Wl,--build-id=none -Wl,-z,max-page-size=4096 \
            tests/fixtures/original_compiled_ipc.c -o build/original_compiled_ipc.elf
      - name: Run the independently linked AArch64 C IPC guest
        shell: bash
        run: |
          set -euo pipefail
          output="$(./build/nint2 --run-synthetic build/original_compiled_ipc.elf)"
          test "$output" = "C guest IPC verified!"
      - name: Independently link and execute two original AArch64 IPC processes
        shell: bash
        run: |
          set -euo pipefail
          for program in sender receiver; do
            clang --target=aarch64-none-elf -nostdlib -fuse-ld=lld \
              -Wl,-Ttext=0x10000 -Wl,--build-id=none -Wl,-z,max-page-size=4096 \
              "tests/fixtures/original_${program}.s" \
              -o "build/original_${program}_linked.elf"
          done
          ./build/nint2_multi_guest_elf_tests --run-pair \
            build/original_sender_linked.elf build/original_receiver_linked.elf
      - name: Compile optimized freestanding AArch64 division guest
        shell: bash
        run: |
          set -euo pipefail
          clang --target=aarch64-none-elf -O1 -ffreestanding -fno-builtin \
            -fno-stack-protector -fno-unwind-tables -nostdlib -fuse-ld=lld \
            -Wl,-e,_start -Wl,-Ttext=0x10000 -Wl,-z,max-page-size=4096 \
            -Wl,--build-id=none tests/fixtures/original_division_c.c \
            -o build/original_division_c.elf
      - name: Execute compiled AArch64 integer division guest
        shell: bash
        run: |
          set -euo pipefail
          output="$(./build/nint2 --run-synthetic build/original_division_c.elf)"
          test "$output" = "AArch64 C divide verified!"
      - name: Cross-compile optimized original C ROR-immediate guest
        shell: bash
        run: |
          set -euo pipefail
          clang --target=aarch64-none-elf -O1 -ffreestanding -fno-builtin \
            -fno-stack-protector -fno-unwind-tables -nostdlib -fuse-ld=lld \
            -Wl,-e,_start -Wl,-Ttext=0x10000 -Wl,-z,max-page-size=4096 \
            -Wl,--build-id=none tests/fixtures/original_ror_c.c \
            -o build/original_ror_c.elf
          llvm-objdump -d build/original_ror_c.elf > build/original_ror_c.disasm
          grep -Eq '\\bror\\s+x[0-9]+, x[0-9]+, #0x11' build/original_ror_c.disasm
      - name: Execute optimized original ARM64 C rotate guest
        shell: bash
        run: |
          set -euo pipefail
          output="$(./build/nint2 --run-synthetic build/original_ror_c.elf)"
          test "$output" = "Optimized ARM64 rotate!"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNINT2_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNINT2_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
