name: C++ Foundation CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNINT2_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNINT2_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
